name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: PYTHONPATH=src python -m runproof.cli --models examples/models.json --hardware examples/hardware.json --workload examples/workload.json --output generated
      - run: python -m json.tool generated/passport.json > /dev/null
